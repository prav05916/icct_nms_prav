# ICCT LNMS dedicated remote syslog receiver.
# Copy to /etc/rsyslog.d/30-icct-lnms.conf

module(load="imudp")
module(load="imtcp")

ruleset(name="icctRemote") {
    action(type="omfile" file="/var/log/icct-lnms/remote.log" createDirs="on")
    stop
}

input(type="imudp" port="514" ruleset="icctRemote")
input(type="imtcp" port="514" ruleset="icctRemote")
